[workspace]
members = ["granite-core", "granite"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.104"
assert_cmd = "2.2.2"
blake3 = { version = "1.8.7", features = ["rayon"] }
clap = { version = "4.6.6", features = ["derive"] }
proptest = "1.11.0"
rustix = { version = "1.1.4", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.20"
walkdir = "2.5.0"
yaml-rust2 = "0.12.0"
